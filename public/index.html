<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Agent Test Console</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; --user:#2563eb; --bot:#eef0f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1e24; --text:#e6e8eb; --muted:#9aa3af; --line:#2a2f37; --bot:#262b33; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:16px; margin:0; flex:1; }
  select, button, input { font:inherit; }
  select, input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  button { padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px; max-width:1100px; margin:0 auto; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; min-height:60vh; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; max-height:65vh; }
  .msg { max-width:80%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--user); color:#fff; }
  .bot { align-self:flex-start; background:var(--bot); }
  .samples { padding:8px 14px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid var(--line); }
  .samples button { font-size:13px; padding:5px 10px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  form input { flex:1; }
  aside { padding:14px; overflow-y:auto; max-height:75vh; }
  aside h2 { font-size:14px; margin:0 0 8px; }
  .trace { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; font:12px/1.4 ui-monospace,monospace; word-break:break-word; }
  .trace b { color:var(--accent); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Customer Agent Test Console</h1>
  <label class="muted">Domain <select id="domain"></select></label>
  <button class="ghost" id="reset">Reset chat</button>
</header>
<main>
  <section class="panel">
    <div id="log"></div>
    <div class="samples" id="samples"></div>
    <form id="form"><input id="input" placeholder="Type as the customer…" autocomplete="off"><button id="send">Send</button></form>
  </section>
  <section class="panel"><aside>
    <h2>Tool calls (what the agent did)</h2>
    <div id="traces"><span class="muted">None yet.</span></div>
  </aside></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let domains = [], messages = [];

const current = () => domains.find((d) => d.id === $("domain").value);

function add(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function reset() {
  messages = [];
  $("log").innerHTML = "";
  $("traces").innerHTML = '<span class="muted">None yet.</span>';
  const d = current();
  add("bot", d.greeting);
  $("samples").innerHTML = "";
  d.samplePrompts.forEach((p) => {
    const b = document.createElement("button");
    b.className = "ghost"; b.type = "button"; b.textContent = p;
    b.onclick = () => send(p);
    $("samples").appendChild(b);
  });
}

async function send(text) {
  if (!text.trim()) return;
  add("user", text);
  messages.push({ role: "user", content: text });
  const pending = add("bot", "…");
  $("send").disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ domain: $("domain").value, messages }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    messages = data.messages;
    pending.textContent = data.reply;
    if (data.traces.length) {
      if ($("traces").querySelector(".muted")) $("traces").innerHTML = "";
      data.traces.forEach((t) => {
        const el = document.createElement("div");
        el.className = "trace";
        el.innerHTML = "<b></b><br>in: <span class='i'></span><br>out: <span class='o'></span>";
        el.querySelector("b").textContent = t.tool;
        el.querySelector(".i").textContent = JSON.stringify(t.input);
        el.querySelector(".o").textContent = JSON.stringify(t.output);
        $("traces").prepend(el);
      });
    }
  } catch (e) {
    pending.textContent = "Error: " + e.message;
    messages.pop();
  }
  $("send").disabled = false;
}

$("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; send(t); };
$("reset").onclick = reset;
$("domain").onchange = reset;

fetch("/api/domains").then((r) => r.json()).then((d) => {
  domains = d;
  $("domain").innerHTML = d.map((x) => `<option value="${x.id}">${x.label}</option>`).join("");
  reset();
});
</script>
</body>
</html>
